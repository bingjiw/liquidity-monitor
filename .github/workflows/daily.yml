name: daily-liquidity

on:
  schedule:
    # 美东傍晚数据更新后运行:UTC 23:30,周一到周五(北京时间次日 7:30)
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests openpyxl xlrd
      - name: Fetch SPY/QQQ prices for the calibrated signal
        run: python backtest/fetch_market.py
        continue-on-error: true
      - run: python liquidity_monitor.py --out output
      - name: Commit results
        run: |
          git config user.name "liquidity-bot"
          git config user.email "liquidity-bot@users.noreply.github.com"
          git add output/ docs/
          git diff --cached --quiet || git commit -m "Daily liquidity report $(date -u +%F)"
          git push

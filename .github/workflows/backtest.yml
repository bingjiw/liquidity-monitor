name: backtest

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["backtest/**", ".github/workflows/backtest.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python backtest/fetch_market.py
      - name: Commit results
        run: |
          git config user.name "liquidity-bot"
          git config user.email "liquidity-bot@users.noreply.github.com"
          git add output/market.csv
          git diff --cached --quiet || git commit -m "Update market prices $(date -u +%F)"
          git push
